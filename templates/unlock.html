<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VaultGen — Unlock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>
<body class="vg-auth-body">
  <div class="vg-auth-wrap">
    <div class="text-center mb-4">
      <div class="vg-auth-icon mb-3">
        <i class="bi bi-lock-fill"></i>
      </div>
      <h1 class="h4 fw-bold">Vault Locked</h1>
      <p class="text-muted small">Enter your master password to unlock.</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <div class="mb-4">
        <label class="form-label small text-muted">Master Password</label>
        <input type="password" class="form-control vg-input" name="master_password"
               required autofocus autocomplete="current-password" placeholder="Enter master password" />
      </div>
      <button type="submit" class="btn btn-accent w-100">
        <i class="bi bi-unlock me-1"></i>Unlock Vault
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
